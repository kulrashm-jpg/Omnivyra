# Secret scan (SEC log-redaction / secret-scan programme).
#
# Runs gitleaks over the commits a pull request ADDS (base..head), with the repository
# config (.gitleaks.toml) and --redact so a finding never prints the secret value.
# It does not scan full history: the existing history leak is handled by rotation, not by
# a gate.
#
# Supply chain: the gitleaks binary is downloaded from the official GitHub release and
# verified against a pinned SHA-256 before it is executed; actions/checkout is pinned by
# full commit SHA (v4.2.2). No third-party action and no secret is used.
#
# Making this a REQUIRED check is a branch-protection setting (founder action):
# Settings -> Branches -> main -> Require status checks -> "secret-scan / gitleaks".
name: secret-scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history for the PR range)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan pull-request commits (values redacted)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}" \
            .

