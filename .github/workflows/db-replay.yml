name: Database Replay & Drift Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db-replay-check.sh'
      - 'scripts/db-audit-rls.js'
      - 'scripts/check-no-database-folder.js'
      - '.github/workflows/db-replay.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-replay.yml'

jobs:
  database-folder-guard:
    name: Reject reintroduction of database/*.sql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run database folder guard
        run: node scripts/check-no-database-folder.js

  replay-and-audit:
    name: Clean replay + RLS audit
    runs-on: ubuntu-latest
    needs: database-folder-guard
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pg client (for db-audit-rls.js)
        run: npm install --no-save pg

      - name: Start local Supabase
        run: supabase start

      - name: Capture local DB URL
        id: dburl
        run: echo "DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Run replay check
        env:
          DB_URL: ${{ steps.dburl.outputs.DB_URL }}
        run: bash scripts/db-replay-check.sh

      - name: Run RLS audit (explicit, in case --skip-rls in script)
        env:
          DB_URL: ${{ steps.dburl.outputs.DB_URL }}
        run: node scripts/db-audit-rls.js

      - name: Stop local Supabase
        if: always()
        run: supabase stop || true

# Notes for maintainers:
#   - This workflow only runs when supabase/migrations/** changes (path filter).
#   - The replay-and-audit job is REQUIRED for merging PRs that touch migrations.
#   - The database-folder-guard runs on every PR matching the path filter; it is
#     cheap and protects against database/*.sql being re-introduced.
#   - Long-tail drift (335 tables not yet in canonical, see
#     supabase/_snapshot/schema_drift_report.md) does NOT cause this workflow to
#     fail today. It will surface in the replay step output as "relation does
#     not exist" errors when migration 20260504020001/020002 ALTER tables that
#     don't exist on the fresh DB. To soften that until E2..E7 land, see the
#     follow-up TODO at the bottom of the report.
