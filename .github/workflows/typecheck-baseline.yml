name: TypeScript Baseline

on:
  pull_request:
  push:
    branches: [main]
  # CI-P13: on-demand full run of main (all steps run for this event).
  workflow_dispatch: {}

concurrency:
  # CI-P12: a newer push to the SAME pull request cancels that PR's superseded
  # run. Every other event (push to main, tags, release, workflow_dispatch) gets
  # a group unique to its own run, so it is never cancelled and never queued
  # behind (or replaced by) another run. The newest commit's run is never
  # cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-baseline:
    name: Non-regression TypeScript baseline
    runs-on: ubuntu-latest
    # CI-P12: runaway cap only (the job previously had the 360-minute default).
    # Generous on purpose: this job runs the full TS baseline, the worker tsc,
    # ten static gates, two jest groups and the TS7 advisory install.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # CI-P12: npm download cache (~/.npm). `npm ci` below still performs a
          # clean, lockfile-exact install; only the tarball downloads are reused.
          # Both lockfiles key it because the TS7 advisory step runs its own
          # `npm --prefix tools/ts7 ci`.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/ts7/package-lock.json

      # CI-P13: post-merge redundancy check (push to main only). The merge is
      # FRESH when the PR head (parent 2) already contained the previous main
      # (parent 1): the merged tree is then exactly the tree this job's PR run
      # compiled, so re-compiling it on main buys no assurance. Anything else —
      # a stale merge, a single-parent commit, an API error — is NOT fresh and
      # runs everything (fail-safe). This step never fails the job, so the
      # security gates below always run on every main commit.
      - name: Post-merge freshness check
        id: freshness
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          fresh=false
          parents=$(gh api "repos/$REPO/commits/$SHA" --jq '[.parents[].sha] | join(" ")' 2>/dev/null) || parents=""
          set -- $parents
          if [ "$#" -eq 2 ]; then
            behind=$(gh api "repos/$REPO/compare/$1...$2" --jq .behind_by 2>/dev/null) || behind=""
            [ "$behind" = "0" ] && fresh=true
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "parents: ${parents:-unknown}; fresh=$fresh"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript non-regression baseline
        if: github.event_name != 'push' || steps.freshness.outputs.fresh != 'true'
        run: npm run typecheck:ci

      # GOV-IMPLEMENT-003: worker compilation gate. Railway builds the worker image
      # via `tsc -p tsconfig.worker.json`; a worker type error only surfaced AFTER
      # the image push. This step fails the PR if the worker would not compile —
      # identical to the local pre-commit hook (same tsconfig, --noEmit / no emit,
      # no external dependencies). Reuses the job's single `npm ci`.
      - name: Worker compilation typecheck
        if: github.event_name != 'push' || steps.freshness.outputs.fresh != 'true'
        run: npx tsc -p tsconfig.worker.json --noEmit

      # ENG-IMPL-002: migration quality gate (preventative). Fails the PR if a NEW
      # migration uses the legacy date-only prefix, collides with an existing
      # version, or omits IF NOT EXISTS on additive DDL. Historical migrations are
      # frozen (scripts/migrations/historical-baseline.txt) — no retroactive
      # failures. Deterministic, read-only, no DB/network. Same script locally
      # (`npm run check:migrations`) and in CI.
      # STEP 3AH-91 (F2): a new migration must also sort after every migration
      # in scripts/migrations/ordering-baseline.txt, and its security rules now
      # cover views/materialized views, grants to client roles, default
      # privileges, RLS disable, ALTER FUNCTION/POLICY, `TO authenticated USING
      # (true)`, and tables created inside DO blocks / EXECUTE strings.
      - name: Migration quality gate
        run: node scripts/check-migration-quality.js

      # F-D1 (2026-10-31): generated/schema-column-manifest.json is committed and
      # shipped verbatim (bootFingerprint reads it; /api/health/version reports its
      # manifest_hash). Nothing regenerates it at build time, and it sat stale from
      # 2026-05-20 to 2026-10-31. Fail the PR when a migration changes the
      # users/companies column attribution without the regenerated file.
      # Deterministic, read-only, no DB/network; never writes.
      - name: Schema manifest freshness
        run: node scripts/generate-schema-manifest.js --check

      # HARDEN-005A: fail the build if new code makes a raw dynamic-URL outbound
      # request that bypasses the centralized SSRF layer (lib/security/safeFetch).
      # STEP 3AH-91 (F3): also scans lib/** server modules and flags template
      # literals whose HOST is dynamic (`https://${host}`, `${baseUrl}/x`).
      # STEP 3AH-91 (W2F-4): also fetch ALIASES (`const doFetch = fetch`,
      # `cfg.fetchImpl(url)`) and a raw fetch injected as a fetch implementation.
      - name: Outbound-SSRF guard
        run: npm run check:ssrf

      # HARDEN-007: fail the build if a NEW API route reads tenant-owned data by
      # a request-supplied tenant id without an approved authorization call.
      - name: Tenant-authz guard
        run: npm run check:authz

      # ROUTE-AUTH-001 (STEP 3AH-85): default-deny authentication gate. Every
      # pages/api route must INVOKE an approved authentication primitive
      # (provenance-checked), bind request-supplied tenant/object/campaign ids,
      # and never gate on a fail-open secret — or be a reviewed entry in
      # scripts/route-auth-allowlist.json whose evidence is re-verified here.
      # No grandfathered baseline: this step is blocking.
      # STEP 3AH-91 (F1): R1-METHOD — every HTTP-method branch of a handler
      # must reach a primitive (shared prelude, wrapper, or the branch itself).
      # STEP 3AH-91 (W2F-1/W2F-3): routes that RE-EXPORT their default handler
      # are analysed through the served module; R4-ENV flags secret checks that
      # reject only in production. Confirmed open R2/R3/R4-ENV findings owned by
      # another workstream are printed as KNOWN OPEN (never R1/R1-METHOD/R4).
      - name: Route authentication gate
        run: npm run check:route-auth

      # WITHRBAC-STRUCT-001: fail the build if a withRBAC route re-derives a
      # tenant identifier and operates on it without binding to the company the
      # wrapper authorized (req.rbac.companyId) or an approved ownership
      # primitive. This is the "wrapper authorizes A, handler operates on B"
      # class found in RECOMMENDATIONS-SEC-001, OPPORTUNITIES-SEC-001 and
      # WITHRBAC-SEC-001.
      - name: withRBAC identifier-binding guard
        run: npm run check:rbac-binding

      # ORGACCESS-BINDING-SEC-001: the same class for the OTHER wrapper.
      # withOrgAccess resolves query.org_id || body.org_id || body.organization_id
      # || body.companyId, so a handler re-deriving the organization can diverge
      # both from the query AND — because the body keys are themselves ordered —
      # from the body, with no query string at all. Found in
      # checkout/{create-order,verify,close} and usage/track.
      - name: withOrgAccess identifier-binding guard
        run: npm run check:orgaccess-binding

      # SECRETS-GATE (STEP 3AH-91, F4): fail the build if a TRACKED file carries
      # a high-confidence credential (provider API keys, Supabase secret /
      # service_role JWTs, GitHub/Slack/AWS tokens, PEM private keys, Stripe
      # live/webhook secrets, postgres URLs with a password on a non-local host,
      # RAILWAY_TOKEN / *_ENCRYPTION_KEY assignments, long Bearer literals) or a
      # committed dotenv file. Never prints a matched value (file:line + pattern
      # only). Reviewed test placeholders live in
      # scripts/security/secrets-allowlist.json, pinned by value fingerprint.
      - name: Secret-pattern gate
        run: npm run check:secrets

      # STEP 3AH-91 (W2F-2): constant-time secret comparison gate. Fails the
      # build when pages/api/** or backend/** compares a value with === / !==
      # against a secret-derived value (process.env.*SECRET|TOKEN|KEY*, a
      # variable assigned from one, an HMAC/signature derivation, or a
      # secret-named operand). Use constantTimeEqual / bearerTokenMatches
      # (backend/security/constantTimeEqual). Reviewed exceptions carry
      # `// ct-ok: <reason>`; confirmed open findings owned by another
      # workstream are printed as KNOWN OPEN on every run.
      - name: Constant-time secret comparison gate
        run: npm run check:constant-time

      # STEP 3AH-91 (F7): the security gates' own fixture suites. A gate whose
      # detection silently regresses (e.g. a refactor that stops seeing
      # per-method branches, template-literal hosts, DO-block tables, or a
      # pattern) still exits 0 on a clean tree — only its fixtures notice.
      # Hermetic: the suites import the gate scripts only; the placeholders
      # below satisfy the shared jest setup and reach nothing.
      - name: Security gate fixture tests
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-hermetic-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-hermetic-placeholder-anon-key
          REDIS_URL: 'redis://localhost:6379'
          OPENAI_API_KEY: 'sk-ci-hermetic-placeholder'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: npm run test:security-gates

      # Deploy-gate contracts: predeploy-check.js, the schema-parity verifier it
      # calls, and the verifier's migration-ledger classifier
      # (scripts/lib/migrationLedger.js). None ran in any workflow, so a regression could again let a
      # schema check that never connected end in a passing verdict, or let strict
      # mode stop requiring the database gate. Hermetic: the verifier suite runs the
      # script with no reachable database, and the predeploy suite reads source only.
      # Fail loud: a renamed or deleted suite fails here instead of vanishing.
      - name: Deploy gate contract tests
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-hermetic-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-hermetic-placeholder-anon-key
          REDIS_URL: 'redis://localhost:6379'
          OPENAI_API_KEY: 'sk-ci-hermetic-placeholder'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          set -euo pipefail
          SUITES=(
            backend/tests/unit/predeployCheckGateHonesty.test.ts
            backend/tests/unit/schemaParityVerifierContract.test.ts
            backend/tests/unit/migrationLedgerClassifier.test.ts
            # Prospect provenance manifest change: runtime exit contract (stubbed
            # pg), strict-mode mapping, no-downgrade snapshot, ledger pin.
            backend/tests/unit/piProvSchemaGateContract.test.ts
            # F-D1: schema manifest --check contract (stale ⇒ exit 1, never writes).
            backend/tests/unit/schemaManifestCheck.test.ts
          )
          for s in "${SUITES[@]}"; do
            test -f "$s" || { echo "Gated suite missing — renamed, moved or deleted: $s"; exit 1; }
          done
          node ./node_modules/jest/bin/jest.js --ci --no-coverage --runTestsByPath "${SUITES[@]}"

      # AUTH-ENFORCEMENT Phase 1 (C-3/C-4): route-policy inventory + validation
      # warnings. Non-blocking by design in Phase 1 (docs/security/
      # AUTH-ENFORCEMENT-ARCHITECTURE.md v3 §5); ROUTE_POLICY_STRICT=1 promotes
      # findings to failures in Phase 2.
      - name: Route-policy inventory (warn)
        run: npm run check:route-policy

      # TS7-READINESS (advisory, never blocking). TypeScript 6.0.3 remains the
      # authoritative compiler for every gate above; this step only answers
      # "would our source still check under TypeScript 7?" so the answer is
      # tracked continuously rather than rediscovered during a future migration.
      #
      # tools/ts7 is a SEPARATE package tree with its own lockfile, installed by
      # its own `npm ci`. It is deliberately not part of the root install:
      # `typescript@7` claims node_modules/.bin/tsc, which would silently swap
      # the compiler behind the worker typecheck step above.
      #
      # continue-on-error because full TS7 migration is blocked on ts-jest and
      # @typescript-eslint publishing TS7-capable releases — an external
      # dependency that must never fail an Omnivyra PR.
      - name: TypeScript 7 readiness (advisory)
        if: github.event_name != 'push' || steps.freshness.outputs.fresh != 'true'
        continue-on-error: true
        run: |
          npm --prefix tools/ts7 ci
          npm run typecheck:ts7

      # CI-P13: Certification, PI, Campaign, Report and Snapshot no longer run on
      # push to main. A stale merge (PR head did not contain the previous main)
      # landed code no PR run tested as a whole, so main goes red here until the
      # full suite is dispatched on main. With strict up-to-date branch
      # protection this cannot happen; it is the alarm if that setting is lost.
      - name: Stale-merge alarm
        if: always() && github.event_name == 'push' && steps.freshness.outputs.fresh != 'true'
        run: |
          echo "::error::Merge ${GITHUB_SHA} was not up to date with main when merged (or freshness could not be determined)."
          echo "Run the full suite on main: gh workflow run <file> --ref main for typecheck-certification.yml, pi-verification.yml,"
          echo "campaign-generation-contracts.yml, report-consistency.yml, snapshot-remediation-contracts.yml and typecheck-baseline.yml."
          exit 1
