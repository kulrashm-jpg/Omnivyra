name: TypeScript Baseline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-baseline:
    name: Non-regression TypeScript baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript non-regression baseline
        run: npm run typecheck:ci

      # GOV-IMPLEMENT-003: worker compilation gate. Railway builds the worker image
      # via `tsc -p tsconfig.worker.json`; a worker type error only surfaced AFTER
      # the image push. This step fails the PR if the worker would not compile —
      # identical to the local pre-commit hook (same tsconfig, --noEmit / no emit,
      # no external dependencies). Reuses the job's single `npm ci`.
      - name: Worker compilation typecheck
        run: npx tsc -p tsconfig.worker.json --noEmit

      # ENG-IMPL-002: migration quality gate (preventative). Fails the PR if a NEW
      # migration uses the legacy date-only prefix, collides with an existing
      # version, or omits IF NOT EXISTS on additive DDL. Historical migrations are
      # frozen (scripts/migrations/historical-baseline.txt) — no retroactive
      # failures. Deterministic, read-only, no DB/network. Same script locally
      # (`npm run check:migrations`) and in CI.
      - name: Migration quality gate
        run: node scripts/check-migration-quality.js

      # HARDEN-005A: fail the build if new code makes a raw dynamic-URL outbound
      # request that bypasses the centralized SSRF layer (lib/security/safeFetch).
      - name: Outbound-SSRF guard
        run: npm run check:ssrf

      # HARDEN-007: fail the build if a NEW API route reads tenant-owned data by
      # a request-supplied tenant id without an approved authorization call.
      - name: Tenant-authz guard
        run: npm run check:authz

      # WITHRBAC-STRUCT-001: fail the build if a withRBAC route re-derives a
      # tenant identifier and operates on it without binding to the company the
      # wrapper authorized (req.rbac.companyId) or an approved ownership
      # primitive. This is the "wrapper authorizes A, handler operates on B"
      # class found in RECOMMENDATIONS-SEC-001, OPPORTUNITIES-SEC-001 and
      # WITHRBAC-SEC-001.
      - name: withRBAC identifier-binding guard
        run: npm run check:rbac-binding

      # AUTH-ENFORCEMENT Phase 1 (C-3/C-4): route-policy inventory + validation
      # warnings. Non-blocking by design in Phase 1 (docs/security/
      # AUTH-ENFORCEMENT-ARCHITECTURE.md v3 §5); ROUTE_POLICY_STRICT=1 promotes
      # findings to failures in Phase 2.
      - name: Route-policy inventory (warn)
        run: npm run check:route-policy
