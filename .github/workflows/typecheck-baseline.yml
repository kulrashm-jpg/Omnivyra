name: TypeScript Baseline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-baseline:
    name: Non-regression TypeScript baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript non-regression baseline
        run: npm run typecheck:ci
