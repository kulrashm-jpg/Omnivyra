name: TypeScript Baseline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-baseline:
    name: Non-regression TypeScript baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript non-regression baseline
        run: npm run typecheck:ci

      # GOV-IMPLEMENT-003: worker compilation gate. Railway builds the worker image
      # via `tsc -p tsconfig.worker.json`; a worker type error only surfaced AFTER
      # the image push. This step fails the PR if the worker would not compile —
      # identical to the local pre-commit hook (same tsconfig, --noEmit / no emit,
      # no external dependencies). Reuses the job's single `npm ci`.
      - name: Worker compilation typecheck
        run: npx tsc -p tsconfig.worker.json --noEmit

      # ENG-IMPL-002: migration quality gate (preventative). Fails the PR if a NEW
      # migration uses the legacy date-only prefix, collides with an existing
      # version, or omits IF NOT EXISTS on additive DDL. Historical migrations are
      # frozen (scripts/migrations/historical-baseline.txt) — no retroactive
      # failures. Deterministic, read-only, no DB/network. Same script locally
      # (`npm run check:migrations`) and in CI.
      # STEP 3AH-91 (F2): a new migration must also sort after every migration
      # in scripts/migrations/ordering-baseline.txt, and its security rules now
      # cover views/materialized views, grants to client roles, default
      # privileges, RLS disable, ALTER FUNCTION/POLICY, `TO authenticated USING
      # (true)`, and tables created inside DO blocks / EXECUTE strings.
      - name: Migration quality gate
        run: node scripts/check-migration-quality.js

      # HARDEN-005A: fail the build if new code makes a raw dynamic-URL outbound
      # request that bypasses the centralized SSRF layer (lib/security/safeFetch).
      # STEP 3AH-91 (F3): also scans lib/** server modules and flags template
      # literals whose HOST is dynamic (`https://${host}`, `${baseUrl}/x`).
      - name: Outbound-SSRF guard
        run: npm run check:ssrf

      # HARDEN-007: fail the build if a NEW API route reads tenant-owned data by
      # a request-supplied tenant id without an approved authorization call.
      - name: Tenant-authz guard
        run: npm run check:authz

      # ROUTE-AUTH-001 (STEP 3AH-85): default-deny authentication gate. Every
      # pages/api route must INVOKE an approved authentication primitive
      # (provenance-checked), bind request-supplied tenant/object/campaign ids,
      # and never gate on a fail-open secret — or be a reviewed entry in
      # scripts/route-auth-allowlist.json whose evidence is re-verified here.
      # No grandfathered baseline: this step is blocking.
      # STEP 3AH-91 (F1): R1-METHOD — every HTTP-method branch of a handler
      # must reach a primitive (shared prelude, wrapper, or the branch itself).
      - name: Route authentication gate
        run: npm run check:route-auth

      # WITHRBAC-STRUCT-001: fail the build if a withRBAC route re-derives a
      # tenant identifier and operates on it without binding to the company the
      # wrapper authorized (req.rbac.companyId) or an approved ownership
      # primitive. This is the "wrapper authorizes A, handler operates on B"
      # class found in RECOMMENDATIONS-SEC-001, OPPORTUNITIES-SEC-001 and
      # WITHRBAC-SEC-001.
      - name: withRBAC identifier-binding guard
        run: npm run check:rbac-binding

      # ORGACCESS-BINDING-SEC-001: the same class for the OTHER wrapper.
      # withOrgAccess resolves query.org_id || body.org_id || body.organization_id
      # || body.companyId, so a handler re-deriving the organization can diverge
      # both from the query AND — because the body keys are themselves ordered —
      # from the body, with no query string at all. Found in
      # checkout/{create-order,verify,close} and usage/track.
      - name: withOrgAccess identifier-binding guard
        run: npm run check:orgaccess-binding

      # SECRETS-GATE (STEP 3AH-91, F4): fail the build if a TRACKED file carries
      # a high-confidence credential (provider API keys, Supabase secret /
      # service_role JWTs, GitHub/Slack/AWS tokens, PEM private keys, Stripe
      # live/webhook secrets, postgres URLs with a password on a non-local host,
      # RAILWAY_TOKEN / *_ENCRYPTION_KEY assignments, long Bearer literals) or a
      # committed dotenv file. Never prints a matched value (file:line + pattern
      # only). Reviewed test placeholders live in
      # scripts/security/secrets-allowlist.json, pinned by value fingerprint.
      - name: Secret-pattern gate
        run: npm run check:secrets

      # STEP 3AH-91 (F7): the security gates' own fixture suites. A gate whose
      # detection silently regresses (e.g. a refactor that stops seeing
      # per-method branches, template-literal hosts, DO-block tables, or a
      # pattern) still exits 0 on a clean tree — only its fixtures notice.
      # Hermetic: the suites import the gate scripts only; the placeholders
      # below satisfy the shared jest setup and reach nothing.
      - name: Security gate fixture tests
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-hermetic-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-hermetic-placeholder-anon-key
          REDIS_URL: 'redis://localhost:6379'
          OPENAI_API_KEY: 'sk-ci-hermetic-placeholder'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: npm run test:security-gates

      # AUTH-ENFORCEMENT Phase 1 (C-3/C-4): route-policy inventory + validation
      # warnings. Non-blocking by design in Phase 1 (docs/security/
      # AUTH-ENFORCEMENT-ARCHITECTURE.md v3 §5); ROUTE_POLICY_STRICT=1 promotes
      # findings to failures in Phase 2.
      - name: Route-policy inventory (warn)
        run: npm run check:route-policy
