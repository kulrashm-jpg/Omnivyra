name: Real-Schema CI

# Executes the canonical database invariants against a real PostgreSQL server.
#
# This is the gate the programme lacked through W0–W5. Every failure those
# phases found in production — a missing column (42703), an uninferable
# ON CONFLICT target (42P10), a tenant-boundary foreign key that was never
# composite — is invisible to the mocked Supabase client the default jest
# project uses, and would have been caught here.
#
# It never touches production: no production secrets are referenced, the
# database is a service container that exists for the life of the job, and the
# schema comes from a committed schema-only artifact.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/_schema/**'
      - 'scripts/ci/**'
      - 'backend/tests/realschema/**'
      - 'backend/db/**'
      - 'backend/services/prospectIdentity/**'
      - 'backend/services/prospectLifecycle/**'
      - 'backend/services/prospectOutcomes/**'
      - 'backend/services/prospectIcp/**'
      - 'backend/services/enrichment/**'
      - 'backend/services/leadOutreachExecution/**'
      - 'pages/api/prospects/**'
      - 'pages/api/outreach/**'
      - 'backend/services/identityResolutionService.ts'
      - 'backend/queue/jobProcessors/whatsappWebhookProcessor.ts'
      # Prospect provenance programme: the unified lead store/reader and the
      # provenance contract + contribution writer. The pi_prov_* realschema
      # suites are already covered by 'backend/tests/realschema/**' above; they
      # are listed explicitly so a later narrowing of that entry cannot
      # silently drop them.
      - 'lib/leadIntelligence/**'
      - 'lib/prospectProvenance/**'
      - 'backend/services/leadIntelligence/**'
      - 'backend/services/prospectProvenance/**'
      - 'pages/api/lead-intelligence/**'
      - 'backend/tests/realschema/pi_prov_*'
      # Orchestration / execution-safety stack (d51360b0..aa5e6966). These modules
      # are exercised against the real schema by backend/tests/realschema/
      # orch_campaign_targets.test.ts directly or through its import graph
      # (prospectLists -> prospectCampaigns -> orchestration/campaignEnrollment ->
      # executionInstances/executionPlans/workflows/workflowExecution/outreachBridge;
      # orchestration/communityIdentityProof -> identityVerification, executionSubject).
      # Community link/identity stores live in backend/services/orchestration/.
      - 'backend/services/prospectLists/**'
      - 'backend/services/prospectCampaigns/**'
      - 'backend/services/orchestration/**'
      - 'backend/services/executionInstances/**'
      - 'backend/services/executionPlans/**'
      - 'backend/services/executionSubject/**'
      - 'backend/services/workflows/**'
      - 'backend/services/workflowExecution/**'
      - 'backend/services/outreachBridge/**'
      - 'backend/services/identityVerification/**'
      - 'pages/api/prospect-lists/**'
      - 'pages/api/prospect-campaigns/**'
      - 'pages/api/execution-instances/**'
      # ─── WhatsApp governance integration ──────────────────────────────
      # `whatsapp_broadcast_person_restriction.test.ts` drives the REAL
      # `processBatch` against the real schema, so the service it exercises must
      # be a trigger path. It was not: the filter carried
      # `whatsappWebhookProcessor.ts` but never the broadcast service, so a change
      # touching only that file skipped the one suite that covers it. The suite
      # and both migrations it depends on are listed explicitly as well — the
      # broader `backend/tests/realschema/**` and `supabase/migrations/**` entries
      # already match them, and naming them means a later narrowing of either
      # cannot silently drop this gate.
      - 'backend/services/whatsappBroadcastService.ts'
      - 'backend/tests/realschema/whatsapp_broadcast_person_restriction.test.ts'
      - 'backend/tests/realschema/whatsapp_send_once_real.test.ts'
      - 'supabase/migrations/20270128000004_whatsapp_broadcast_recipient_person.sql'
      - 'supabase/migrations/20270202000000_pi_contact_governance_read_at.sql'
      - 'jest.realschema.config.js'
      - '.github/workflows/real-schema-ci.yml'
  push:
    # `main` is unchanged. The integration branch is added as an EXACT name, not
    # a pattern: this gate is being enabled for one candidate, and a wildcard
    # would arm a destructive replay for branches nobody reviewed.
    branches:
      - main
      - outreach/whatsapp-governance-integration
    paths:
      - 'supabase/migrations/**'
      - 'supabase/_schema/**'
      - 'scripts/ci/**'
      - 'backend/tests/realschema/**'
      # Same orchestration / execution-safety surface as the pull_request
      # filter above, so a direct push to main that changes it still replays.
      - 'backend/services/prospectLists/**'
      - 'backend/services/prospectCampaigns/**'
      - 'backend/services/orchestration/**'
      - 'backend/services/executionInstances/**'
      - 'backend/services/executionPlans/**'
      - 'backend/services/executionSubject/**'
      - 'backend/services/workflows/**'
      - 'backend/services/workflowExecution/**'
      - 'backend/services/outreachBridge/**'
      - 'backend/services/identityVerification/**'
      - 'pages/api/prospect-lists/**'
      - 'pages/api/prospect-campaigns/**'
      - 'pages/api/execution-instances/**'
      # Present in the pull_request filter above but missing here, so a push that
      # changed only the canonical governance spine — or this workflow — replayed
      # nothing.
      - 'backend/services/prospectIdentity/**'
      - '.github/workflows/real-schema-ci.yml'
      # ─── WhatsApp governance integration ──────────────────────────────
      # `whatsapp_broadcast_person_restriction.test.ts` drives the REAL
      # `processBatch` against the real schema, so the service it exercises must
      # be a trigger path. It was not: the filter carried
      # `whatsappWebhookProcessor.ts` but never the broadcast service, so a change
      # touching only that file skipped the one suite that covers it. The suite
      # and both migrations it depends on are listed explicitly as well — the
      # broader `backend/tests/realschema/**` and `supabase/migrations/**` entries
      # already match them, and naming them means a later narrowing of either
      # cannot silently drop this gate.
      - 'backend/services/whatsappBroadcastService.ts'
      - 'backend/tests/realschema/whatsapp_broadcast_person_restriction.test.ts'
      - 'backend/tests/realschema/whatsapp_send_once_real.test.ts'
      - 'supabase/migrations/20270128000004_whatsapp_broadcast_recipient_person.sql'
      - 'supabase/migrations/20270202000000_pi_contact_governance_read_at.sql'
  workflow_dispatch:

# The job reads the checkout and nothing else. Declared explicitly rather than
# inherited: without this block the token carries whatever the repository's
# default is, and a replay gate has no business being able to write anything.
permissions:
  contents: read

concurrency:
  group: real-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-schema:
    name: Migration replay + canonical invariants
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # pgvector, because the governed schema declares vector(1536) columns.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: w6
          POSTGRES_DB: w6
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d w6"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Localhost service container. Deliberately NOT a repository secret:
      # this job must never be able to reach production.
      W6_DB_URL: postgres://postgres:w6@localhost:5432/w6
      # This job, and only this job, declares that the harness may apply the
      # bootstrap, the baseline restore and the migration replay to a database it
      # did not create: the `services:` container above, on an ephemeral
      # GitHub-hosted runner that is destroyed when the job ends.
      #
      # This is a DECLARATION OF INTENT by the workflow author, and a CONFINEMENT
      # of the script to this context. It is NOT proof that the script owns or
      # created that database — the script cannot prove that and does not claim
      # to. Ownership is proven only in container mode, by the container ID the
      # invocation itself created.
      W6_CI_SERVICE_DB: '1'
      PGPASSWORD: w6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migration quality gate
        run: node scripts/check-migration-quality.js

      - name: Tenant authorization gate
        run: node scripts/check-tenant-authz.js

      # The whole job: bootstrap -> baseline -> replay -> invariant suite.
      # A failure in ANY stage fails the job. There is no continue-on-error
      # anywhere in this workflow by design — a broken tenant boundary or an
      # uninferable conflict target is not a warning.
      - name: Real-schema CI
        run: bash scripts/ci/real-schema-ci.sh

      # GOV-H: FK / NOT NULL / CHECK compatibility against the REPLAYED catalog.
      # This is the only path that covers tables created AFTER the committed
      # baseline's ledger position (supabase/_schema/baseline.json ledgerMax
      # 20260916000000), which is where every PI actor column lives. The static
      # run in typecheck-baseline.yml covers the baseline and nothing newer, so
      # the two are complements, not duplicates.
      #
      # Runs AFTER the replay so the catalog is the end state of every
      # migration — including a contradiction assembled across several of them,
      # which no single-file rule can see.
      #
      # W6_DB_URL is this job's localhost service container, declared in `env:`
      # above and deliberately NOT a repository secret, so this step is not
      # secret-gated and can never skip silently. The script independently
      # refuses any non-loopback host.
      - name: Actor-FK / CHECK compatibility (replayed catalog)
        run: node scripts/ci/check-actor-fk-compatibility.js --db "$W6_DB_URL"

      - name: Report failure context
        if: failure()
        run: |
          echo "::group::Restore errors"
          tail -50 /tmp/w6_restore.err 2>/dev/null || echo "(none)"
          echo "::endgroup::"
          echo "::group::Last migration output"
          tail -50 /tmp/w6_mig.out 2>/dev/null || echo "(none)"
          echo "::endgroup::"
