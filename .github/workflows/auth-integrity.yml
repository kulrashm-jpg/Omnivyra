name: Auth Integrity

# This file holds TWO jobs with deliberately different lifecycles.
#
# 1. `auth-invariants-static` — RUNS ON EVERY PR. Hermetic: node builtins only
#    (fs + path), no secrets, no network, no database, no node_modules. It is the
#    static half that never needed the live backend, and it was being lost purely
#    because it shared a file with the parked E2E job below.
#
# 2. `auth-integrity` — activated by PROVISIONING (see `e2e-secrets-preflight`):
#    it runs when its secrets exist and SKIPS (never fails) while they do not.
#    This is a LIVE-Supabase E2E gate — tests/auth/authTestHarness.ts creates,
#    confirms and deletes real users via the Supabase admin API and exercises real
#    login/callback/logout flows. It requires a NON-production Supabase project's
#    secrets (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
#    SUPABASE_URL, SUPABASE_SECRET_KEY, SESSION_COOKIE_SECRET, ENCRYPTION_KEY; the
#    legacy *_ANON_KEY / *_SERVICE_ROLE_KEY secret names are read as a
#    migration-only fallback). Redis is NOT a secret: the job brings its own
#    ephemeral loopback `redis:7-alpine` service container. Placeholders are
#    impossible for Supabase (admin.createUser needs a real backend); prod must
#    NOT be used (the suite deletes users) and is refused twice before the app
#    server starts.
#
# WHY THE SPLIT: the static check enforces two invariants that are live-relevant
# right now — the auth callback must fail CLOSED (no auth.getSession() fallback,
# session only from token exchange, clear browser state on failure), and NO
# feature file may read or write the global `selected_company_id` / `company_id`
# localStorage keys, which is a cross-tenant leakage vector. Tenant-authorization
# fixes are landing regularly; that invariant should be checked on the PR that
# would break it, not on a manual dispatch nobody runs.
#
on:
  # Repo-wide on purpose: the localStorage invariant is scanned across EVERY
  # .js/.jsx/.ts/.tsx file, so a path filter would miss a violation introduced in
  # a file the filter does not list. The job costs seconds and installs nothing.
  pull_request:
  workflow_dispatch:

concurrency:
  group: auth-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── PR-SAFE HALF ────────────────────────────────────────────────────────────
  # Deliberately installs NOTHING. scripts/check-auth-integrity-invariants.js
  # requires only `fs` and `path` (Node builtins), so `npm ci` would add ~2
  # minutes and a lockfile dependency for zero benefit. If that script ever grows
  # a third-party import this job fails loudly on the missing module rather than
  # skipping — which is the correct outcome, not a silent pass.
  auth-invariants-static:
    name: Static auth invariants (hermetic, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail loudly if the checker is renamed or deleted, rather than letting the
      # invariant quietly stop being enforced.
      - name: Verify the invariant checker exists
        run: test -f scripts/check-auth-integrity-invariants.js

      # Auth callback must fail CLOSED; no feature file may touch the global
      # selected_company_id / company_id localStorage keys (cross-tenant vector).
      - name: Static auth integrity invariants
        run: node scripts/check-auth-integrity-invariants.js

  # ── PROVISIONING PREFLIGHT ──────────────────────────────────────────────────
  # Reports ONLY whether the E2E secrets exist. It never echoes a secret, and
  # never fails: an unprovisioned repo yields provisioned=false and the E2E job
  # below is skipped rather than failed.
  e2e-secrets-preflight:
    name: E2E provisioning preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      provisioned: ${{ steps.check.outputs.provisioned }}
    steps:
      - name: Detect E2E secret provisioning
        id: check
        env:
          S1: ${{ secrets.SUPABASE_URL }}
          S2: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S3: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          S4: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          S5: ${{ secrets.SESSION_COOKIE_SECRET }}
          S6: ${{ secrets.ENCRYPTION_KEY }}
        # REDIS_URL is deliberately NOT a required secret any more: the E2E job
        # runs its own ephemeral loopback Redis service (see `services:` below),
        # so no externally hosted Redis — the only one that exists is
        # production — can ever be wired into this suite.
        run: |
          missing=0
          for v in S1 S2 S3 S4 S5 S6; do
            if [ -z "${!v}" ]; then missing=$((missing+1)); fi
          done
          # Count only — naming which secret is absent is still safe, but the
          # count alone is enough and leaks nothing about configuration.
          if [ "$missing" -eq 0 ]; then
            echo "All 6 E2E secrets present — auth E2E will run."
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "$missing of 6 E2E secrets absent — auth E2E will SKIP (not fail)."
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
          fi

  # ── PARKED HALF (live Supabase E2E) ─────────────────────────────────────────
  auth-integrity:
    name: Auth integrity regression lock
    # ACTIVATION IS DRIVEN BY PROVISIONING, NOT BY A HARD-CODED PARK.
    #
    # This job runs as soon as the E2E secrets exist and SKIPS (never fails)
    # while they do not. A hard-coded park meant a human had to remember to
    # come back and flip it; an unconditional trigger with no secrets would
    # paint every PR red for an environment reason unrelated to authentication.
    #
    # The `secrets` context is NOT available in a job-level `if:`, so presence
    # is computed by the preflight job, which emits only a boolean.
    needs: e2e-secrets-preflight
    if: needs.e2e-secrets-preflight.outputs.provisioned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # EPHEMERAL, per-run Redis. Created with the job and destroyed with the
    # runner, so it holds no production state and the scoped rate-limit reset
    # below is safe by construction. Published on the runner's LOOPBACK only.
    # lib/auth/rateLimit.ts backs the login limiter with Redis and the pre-run
    # counter reset connects explicitly, so a present-but-unreachable URL is not
    # enough. The container's --health-cmd runs INSIDE the container (where
    # redis-cli exists); the host-side check is the node socket step below.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # MUST be localhost, not 127.0.0.1: next.config.js 307-redirects the
      # 127.0.0.1 host to http://localhost:3000 (distinct browser origin, so a
      # separate cookie jar), and the E2E project's auth redirect allow-list only
      # accepts its site_url (http://localhost:3000). Measured on the branch that
      # first ran this suite green in CI: with 127.0.0.1 the callback specs fail.
      AUTH_E2E_BASE_URL: http://localhost:3000
      AUTH_E2E_TIMEOUT_MS: '120000'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SESSION_COOKIE_SECRET: ${{ secrets.SESSION_COOKIE_SECRET }}
      # Phase 138 finding: config/env.schema.ts requires BOTH of these and the
      # job supplied neither, so `npm run dev` died at config validation and the
      # readiness poll timed out with a message that looked like an auth failure.
      # REDIS_URL is the ephemeral loopback service above — never a secret, so it
      # can never be pointed at the production Redis. 127.0.0.1 (not localhost)
      # because the port is published on IPv4 loopback only and Node may resolve
      # localhost to ::1 first.
      REDIS_URL: redis://127.0.0.1:6379
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      # config/env.schema.ts marks OPENAI_API_KEY required and validateEnv()
      # calls process.exit(1) on a miss: the dev server boots, serves the warmup
      # routes, then dies the moment a route imports the config module —
      # surfacing as "fetch failed" / chrome-error pages that look like auth
      # failures. NON-SECRET placeholder on purpose: the auth specs exercise
      # login/callback/logout only and never reach an AI code path.
      OPENAI_API_KEY: e2e-placeholder-not-a-real-key
      # lib/env/namespace.ts enforceEnvIsolationFatal() hard-blocks "remote
      # Supabase URL + loopback REDIS_URL" ("prod-Supabase + local-Redis topology
      # blocked") on every server-side Supabase client construction, so without
      # this every auth API route 500s. Its danger is a local process mutating a
      # REMOTE PRODUCTION DB while its queue jobs land in a Redis no remote worker
      # reads. This job matches the shape but not the danger: the database is
      # proven to be the dedicated non-production E2E project twice before the
      # server starts ("Refuse to run against production" + check:auth-e2e-target)
      # and again at harness load; that project has no remote queue workers; and
      # the Redis is an ephemeral container destroyed with the runner. Bypasses
      # ONLY that topology check — the production-target refusals are untouched.
      # (Invisible locally because Next.js also loads .env.local; CI has none —
      # asserted below — so the guard fires in CI and only in CI.)
      ALLOW_PROD_DB_WITH_LOCAL_REDIS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Static auth integrity invariants
        run: npm run check:auth-integrity-invariants

      # Unit tests for the production guard, the auth-state predicate (with its
      # drift test against utils/authStorage.ts) and the identity cleanup.
      # Hermetic — no network, no database. If these fail the guard is not
      # trustworthy and nothing below should run.
      - name: E2E production-guard unit tests
        run: npm run test:auth-e2e-guard

      # The harness must never read .env.local: it points at PRODUCTION.
      - name: Assert no .env.local is present
        run: |
          if [ -f .env.local ]; then
            echo "::error::.env.local exists in the CI workspace; it must never be materialized for Auth E2E."
            exit 1
          fi
          echo "No .env.local present."

      # HARD SAFETY GATE. The harness calls admin.listUsers and admin.deleteUser.
      # If SUPABASE_URL ever points at the production project this job must die
      # BEFORE the server starts. Compares against the known production ref and
      # prints only a boolean verdict, never the URL.
      - name: Refuse to run against production
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          node -e "
            const PROD='klkiseupptzbecbxwrky';
            const url=String(process.env.SUPABASE_URL||'');
            if (!url) { console.error('SUPABASE_URL empty'); process.exit(1); }
            if (url.includes(PROD)) {
              console.error('REFUSING TO RUN: SUPABASE_URL points at the PRODUCTION project.');
              process.exit(1);
            }
            console.log('Target is non-production: OK');
          "

      # Stricter than the denylist above: the same fail-closed guard the harness
      # runs at module load (tests/auth/e2eEnvironmentGuard.ts) — rejects the
      # production ref/host AND anything that is not the expected E2E project,
      # plus empty, malformed, local and placeholder targets. Verdict only.
      - name: Assert target is the dedicated E2E project
        run: npm run check:auth-e2e-target

      - name: Validate auth test environment
        run: |
          node -e "const required=['NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY','SUPABASE_SECRET_KEY','SESSION_COOKIE_SECRET']; const missing=required.filter((key)=>!process.env[key]); if (missing.length) { console.error('Missing auth integrity CI env:', missing.join(', ')); process.exit(1); }"

      # Proves the service container is reachable from the job before anything
      # depends on it, so an infrastructure failure is distinguishable from a test
      # failure. Refuses any non-loopback target. Speaks RESP over a raw socket:
      # `redis-cli` is NOT installed on the runner host.
      - name: Verify ephemeral Redis is healthy
        run: |
          node -e "
            const net = require('net');
            const u = new URL(process.env.REDIS_URL || '');
            const host = u.hostname.replace(/^\[|\]$/g, '');
            if (!['localhost', '127.0.0.1', '::1'].includes(host)) {
              console.error('REFUSING: E2E Redis is not the ephemeral loopback service container.');
              process.exit(1);
            }
            const port = Number(u.port || 6379);
            const deadline = Date.now() + 30000;
            (function attempt() {
              const s = net.createConnection({ host, port });
              let buf = '';
              const retry = () => {
                s.destroy();
                if (Date.now() > deadline) {
                  console.error('::error::Ephemeral Redis service never answered PING');
                  process.exit(1);
                }
                setTimeout(attempt, 1000);
              };
              s.setTimeout(3000);
              s.on('connect', () => s.write('PING\r\n'));
              s.on('data', (d) => {
                buf += d.toString();
                if (buf.includes('+PONG')) { console.log('Ephemeral loopback Redis answered +PONG'); s.end(); process.exit(0); }
              });
              s.on('timeout', retry);
              s.on('error', retry);
            })();
          "

      # lib/auth/rateLimit.ts allows 10 logins per IP per 15 minutes; a full run
      # performs ~5, so repeated runs trip it and /api/auth/login returns 429,
      # which surfaces as an auth timeout. The limiter stays fully active DURING
      # the run; only pre-run counters are cleared. Scoped SCAN+DEL of the auth
      # rl:* namespaces only, never FLUSHDB; refuses a production Redis URL.
      - name: Reset auth rate-limit counters
        run: npm run reset:auth-e2e-rate-limits

      - name: Start app server
        run: |
          npm run dev > auth-integrity-server.log 2>&1 &
          node -e "const url=process.env.AUTH_E2E_BASE_URL; const deadline=Date.now()+120000; (async()=>{ while(Date.now()<deadline){ try{ const res=await fetch(url); if(res.status<500) return; }catch{} await new Promise(r=>setTimeout(r,1000)); } console.error('Auth integrity dev server did not become ready'); process.exit(1); })();"

      # Runs every spec even if an earlier one fails, prints a PASS/FAIL
      # summary, and still exits non-zero if any failed.
      - name: Auth integrity regression suite
        run: npm run test:auth-integrity

      - name: Upload auth integrity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-integrity-artifacts
          path: |
            auth-integrity-server.log
            test-results/auth-integrity/**
          if-no-files-found: ignore
