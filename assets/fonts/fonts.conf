<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  PHASE 14O — production fontconfig for the Vercel render runtime.

  In production the app hardens process.env as a readonly proxy, so the renderer
  CANNOT set FONTCONFIG_FILE in-process (the write throws). The fix: point native
  fontconfig at THIS bundled config via a spawn-time env var (Vercel project env
  FONTCONFIG_FILE=/var/task/assets/fonts/fonts.conf), which fontconfig reads via
  getenv() — unaffected by the JS proxy. This config then makes the vendored
  Inter fonts discoverable, so SVG <text> (font-family "Inter, Arial") rasterizes
  real glyphs instead of .notdef tofu.

  Paths are the Vercel Lambda runtime paths (traced via outputFileTracingIncludes).
  Dev/local does not use this file (ensureRenderFonts handles dev, where process.env
  is writable).
-->
<fontconfig>
  <dir>/var/task/assets/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>

  <!-- The SVG font-family chains are "Inter, Arial" / "Arial, Helvetica,
       sans-serif" — alias the non-bundled families to the vendored Inter so
       every chain resolves to a real, glyph-complete face. -->
  <alias><family>Arial</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="weak"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
